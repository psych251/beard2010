<!DOCTYPE html>
<html>
  <head>
    <title>Word Sentence Association Paradigm</title>
    <script src="https://unpkg.com/jspsych@8.2.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.0.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.0.0"></script>
    <script src="https://unpkg.com/papaparse@5.3.0/papaparse.min.js"></script>
    <link
      href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* === GLOBAL === */
      body {
        background-color: #f0f0f0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 16px;
        color: black;
      }

      .jspsych-content {
        background-color: #f0f0f0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 16px;
        color: black;
      }
      /* === WHITE CARD STYLING FOR SURVEYS === */
      /* Target both likert and multi-choice survey containers */
      .jspsych-survey-likert-form,
      .jspsych-survey-multi-choice-form,
      form[id^="jspsych-survey"] {
        background-color: white !important;
        padding: 40px !important;
        border-radius: 8px !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
        margin: 20px auto !important;
        max-width: 900px !important;
      }

      /* Include preambles inside the white cards */
      .jspsych-survey-likert-preamble,
      .jspsych-survey-multi-choice-preamble {
        background-color: white !important;
        min-height: 60px;
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px !important;
      }

      /* Ensure button doesn't get white background */
      input.jspsych-btn,
      button.jspsych-btn {
        background-color: #f0f0f0 !important;
        border: 1px solid #ccc !important;
      }

      /* === LOCK CONTAINER WIDTH === */
      .jspsych-content .jspsych-survey-likert {
        margin: 0 auto !important;
        text-align: left !important;
      }

      .jspsych-survey-likert-question {
        margin: 0 auto 30px auto !important;
      }

      .jspsych-survey-likert-statement {
        display: block;
        margin-bottom: 10px;
        text-align: left;
      }

      .jspsych-survey-likert-opts {
        display: flex;
        justify-content: space-between;
        min-width: 700px;
        gap: 20px;
        margin-left: 0;
        padding-left: 0;
      }

      .jspsych-content .jspsych-survey-likert-opt label {
        font-size: 14px !important;
        color: black !important;
        text-align: center !important;
        white-space: normal !important;
      }

      /* === FIXED WIDTH FOR MULTI-CHOICE === */
      .jspsych-survey-multi-choice-question {
        width: 900px !important;
        max-width: 900px !important;
        min-width: 900px !important;
        margin: 0 auto 30px auto !important;
        text-align: left;
      }

      /* === FIXED WIDTH FOR PREAMBLES === */
      .jspsych-survey-likert-preamble,
      .jspsych-survey-multi-choice-preamble {
        width: 900px !important;
        max-width: 900px !important;
        min-width: 900px !important;
        margin: 0 auto !important;
        background-color: white !important;
        min-height: 60px;
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px !important;
      }

      .jspsych-content p,
      .jspsych-content div {
        font-size: 16px;
        color: black;
      }

      /* Responsive fallback */
      @media (max-width: 950px) {
        .jspsych-content .jspsych-survey-likert:not(input),
        .jspsych-content .jspsych-survey-likert-question {
          width: 100% !important;
          min-width: unset !important;
        }

        .jspsych-content .jspsych-survey-likert-opt {
          min-width: 80px !important;
          max-width: unset !important;
        }
      }

      /* FIX: Button should NOT inherit 900px likert container width */
      input.jspsych-survey-likert.jspsych-btn {
        width: auto !important;
        min-width: 0 !important;
        max-width: none !important;
        display: inline-block !important;
        padding: 10px 20px !important;
        margin: 40px auto !important;
        text-align: center !important;
      }

      #jspsych-survey-likert-next {
        display: inline-block !important;
      }

      .jspsych-content {
        text-align: center !important;
      }
    </style>
  </head>
  <body></body>

  <script>
    // Initialize jsPsych
    var jsPsych = initJsPsych({
      on_finish: function () {
        var csv_data = jsPsych.data.get().csv();

        document.body.innerHTML =
          '<div style="color: black; font-size: 16px; padding: 50px; text-align: center; max-width: 700px; margin: 0 auto;">Saving your data...</div>';

        var filename = "wsap_" + subject_id;

        var xhr = new XMLHttpRequest();
        xhr.open(
          "POST",
          "https://web.stanford.edu/~emartz/cgi-bin/save_data.php"
        );
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onload = function () {
          if (xhr.status == 200) {
            document.body.innerHTML =
              '<div style="color: black; font-size: 16px; padding: 50px; text-align: center; max-width: 700px; margin: 0 auto;">Thank you! Your data has been saved.<br><br>You may now close this window.</div>';
          } else {
            document.body.innerHTML =
              '<div style="color: black; font-size: 16px; padding: 50px; text-align: center; max-width: 700px; margin: 0 auto;">There was an error saving your data.<br><br>Please contact the researcher.<br><br>Error: ' +
              xhr.status +
              "</div>";
          }
        };
        xhr.onerror = function () {
          document.body.innerHTML =
            '<div style="color: black; font-size: 16px; padding: 50px; text-align: center; max-width: 700px; margin: 0 auto;">There was an error saving your data.<br><br>Please contact the researcher.</div>';
        };
        xhr.send(
          JSON.stringify({
            filedata: csv_data,
            filename: filename,
          })
        );
      },
    });

    var assigned_set = Math.random() < 0.5 ? "A" : "B";
    var subject_id = jsPsych.randomization.randomID(15);
    var experiment_start_time;

    jsPsych.data.addProperties({
      subject: subject_id,
      set_assigned: assigned_set,
    });

    Papa.parse("WSAP.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function (results) {
        runExperiment(results.data);
      },
      error: function (error) {
        alert("Error loading stimuli file: " + error);
      },
    });

    function runExperiment(all_stimuli) {
      var timeline = [];
      var set_stimuli = all_stimuli.filter(function (trial) {
        return trial.Test === assigned_set;
      });

      console.log(
        "Total trials for Set " + assigned_set + ":",
        set_stimuli.length
      );

      // Welcome screen
      var welcome = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>Thank you for taking the time to participate in this experiment. 
              Your responses are important to us. You will be asked a series of 
              brief questionnaires, and then will complete a brief activity.</p>
              
              <p>This experiment should take about 15-20 minutes to complete.</p>
              <p>By answering the following questions, you are participating in a study being performed by cognitive scientists in the Stanford Department of Psychology. If you have questions about this research, please contact us at stanfordpsych251@gmail.com. You must be at least 18 years old to participate. Your participation in this research is voluntary. You may decline to answer any or all of the following questions. You may decline further participation, at any time, without adverse consequences. Your anonymity is assured; the researchers who have requested your participation will not receive any personal information about you.</p>
            <p>Press any key to continue.</p>
          </div>
        `,
        on_start: function () {
          experiment_start_time = Date.now();
        },
      };
      timeline.push(welcome);

      var demographics_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>First, we'd like to collect some basic demographic information.</p>
            <p>Please answer the following questions.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(demographics_instructions);

      // ===== DEMOGRAPHICS - Individual Questions =====
      var demo_age = {
        type: jsPsychSurveyMultiChoice,
        questions: [
          {
            prompt: "What is your age?",
            name: "age",
            options: [
              "Under 18",
              "18-24",
              "25-34",
              "35-44",
              "45-54",
              "55-64",
              "65 or older",
            ],
            required: true,
          },
        ],
        data: { task: "demographics" },
        on_finish: function (data) {
          data.age = data.response.age;
        },
      };
      timeline.push(demo_age);

      var demo_gender = {
        type: jsPsychSurveyMultiChoice,
        questions: [
          {
            prompt: "What is your gender?",
            name: "gender",
            options: [
              "Male",
              "Female",
              "Non-binary",
              "Prefer not to say",
              "Prefer to self-describe",
            ],
            required: true,
          },
        ],
        data: { task: "demographics" },
        on_finish: function (data) {
          data.gender = data.response.gender;
        },
      };
      timeline.push(demo_gender);

      var demo_race = {
        type: jsPsychSurveyMultiChoice,
        questions: [
          {
            prompt:
              "What is your race/ethnicity? (Select the option that best describes you)",
            name: "race_ethnicity",
            options: [
              "American Indian or Alaska Native",
              "Asian",
              "Black or African American",
              "Hispanic or Latino",
              "Native Hawaiian or Other Pacific Islander",
              "White",
              "Multiracial",
              "Prefer not to say",
              "Other",
            ],
            required: true,
          },
        ],
        data: { task: "demographics" },
        on_finish: function (data) {
          data.race_ethnicity = data.response.race_ethnicity;
        },
      };
      timeline.push(demo_race);

      var demo_education = {
        type: jsPsychSurveyMultiChoice,
        questions: [
          {
            prompt: "What is your highest level of education completed?",
            name: "education",
            options: [
              "Less than high school",
              "High school graduate or equivalent",
              "Some college, no degree",
              "Associate degree",
              "Bachelor's degree",
              "Master's degree",
              "Doctoral degree or higher",
              "Prefer not to say",
            ],
            required: true,
          },
        ],
        data: { task: "demographics" },
        on_finish: function (data) {
          data.education = data.response.education;
        },
      };
      timeline.push(demo_education);

      var demo_english = {
        type: jsPsychSurveyMultiChoice,
        questions: [
          {
            prompt: "Is English your native language?",
            name: "native_english",
            options: ["Yes", "No"],
            required: true,
          },
        ],
        data: { task: "demographics" },
        on_finish: function (data) {
          data.native_english = data.response.native_english;
        },
      };
      timeline.push(demo_english);

      var questionnaires_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>You will now complete a series of brief questionnaires.</p>
            <p>Please read each statement carefully and respond honestly.</p>
            <p>There are no right or wrong answers.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(questionnaires_instructions);

      // ===== SPIN (Social Phobia Inventory) - Instructions =====
      var spin_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>Please read each statement and select the response that indicates how much the statement applied to you over the <strong>past week</strong>.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(spin_instructions);

      // ===== SPIN Items =====
      var spin_items = [
        "I am afraid of people in authority",
        "I am bothered by blushing in front of people",
        "Parties and social events scare me",
        "I avoid talking to people I don't know",
        "Being criticized scares me a lot",
        "I avoid doing things or speaking to people for fear of embarrassment",
        "Sweating in front of people causes me distress",
        "I avoid going to parties",
        "I avoid activities in which I am the center of attention",
        "Talking to strangers scares me",
        "I avoid having to give speeches",
        "I would do anything to avoid being criticized",
        "Heart palpitations bother me when I am around people",
        "I am afraid of doing things when people might be watching",
        "Being embarrassed or looking stupid are among my worst fears",
        "I avoid speaking to anyone in authority",
        "Trembling or shaking in front of others is distressing to me",
      ];

      var spin_scale = [
        "Not at all",
        "A little bit",
        "Somewhat",
        "Very much",
        "Extremely",
      ];

      var spin_responses = {};

      for (var i = 0; i < spin_items.length; i += 4) {
        var page_items = spin_items.slice(i, i + 4);
        var page_questions = page_items.map(function (item, idx) {
          var item_num = i + idx + 1;
          return {
            prompt: item_num + ". " + item,
            name: "spin_" + item_num,
            labels: spin_scale,
            required: true,
          };
        });

        var spin_page = {
          type: jsPsychSurveyLikert,
          questions: page_questions,
          data: {
            task: "spin",
            measure: "social_anxiety",
          },
          on_finish: function (data) {
            var responses = data.response;
            for (var key in responses) {
              data[key] = responses[key];
              spin_responses[key] = responses[key];
            }

            if (Object.keys(spin_responses).length === 17) {
              var total = 0;
              for (var key in spin_responses) {
                total += spin_responses[key];
              }
              data.spin_total = total;
              jsPsych.data.addProperties({ spin_total: total });
            }
          },
        };
        timeline.push(spin_page);
      }

      // ===== STAI STATE (Form Y-1) - Instructions =====
      var stai_state_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>A number of statements which people have used to describe themselves are given below. 
            Read each statement and then select the appropriate response to indicate how you feel 
            <strong>right now, that is, at this moment</strong>.</p>
            <p>There are no right or wrong answers. 
            Do not spend too much time on any one statement but give the answer which seems to 
            describe your present feelings best.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(stai_state_instructions);

      // ===== STAI STATE Items =====
      var stai_state_items = [
        "I feel calm",
        "I feel secure",
        "I am tense",
        "I feel strained",
        "I feel at ease",
        "I feel upset",
        "I am presently worrying over possible misfortunes",
        "I feel satisfied",
        "I feel frightened",
        "I feel comfortable",
        "I feel self-confident",
        "I feel nervous",
        "I am jittery",
        "I feel indecisive",
        "I am relaxed",
        "I feel content",
        "I am worried",
        "I feel confused",
        "I feel steady",
        "I feel pleasant",
      ];

      var stai_state_scale = [
        "Not at all",
        "Somewhat",
        "Moderately so",
        "Very much so",
      ];

      var stai_state_responses = {};
      var stai_state_reverse = [1, 2, 5, 8, 10, 11, 15, 16, 19, 20];

      for (var i = 0; i < stai_state_items.length; i += 4) {
        var page_items = stai_state_items.slice(i, i + 4);
        var page_questions = page_items.map(function (item, idx) {
          var item_num = i + idx + 1;
          return {
            prompt: item_num + ". " + item,
            name: "stai_state_" + item_num,
            labels: stai_state_scale,
            required: true,
          };
        });

        var stai_state_page = {
          type: jsPsychSurveyLikert,
          questions: page_questions,
          data: {
            task: "stai_state",
            measure: "state_anxiety",
          },
          on_finish: function (data) {
            var responses = data.response;
            for (var key in responses) {
              data[key] = responses[key];
              stai_state_responses[key] = responses[key];
            }

            if (Object.keys(stai_state_responses).length === 20) {
              var total = 0;
              for (var key in stai_state_responses) {
                var item_num = parseInt(key.split("_")[2]);
                var score = stai_state_responses[key];

                if (stai_state_reverse.indexOf(item_num) !== -1) {
                  score = 3 - score;
                }
                total += score;
              }
              data.stai_state_total = total + 20;
              jsPsych.data.addProperties({ stai_state_total: total + 20 });
            }
          },
        };
        timeline.push(stai_state_page);
      }

      // ===== STAI TRAIT (Form Y-2) - Instructions =====
      var stai_trait_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>A number of statements which people have used to describe themselves are given below. 
            Read each statement and then select the appropriate response to indicate 
            <strong>how you generally feel</strong>.</p>
            <p>There are no right or wrong answers. 
            Do not spend too much time on any one statement but give the answer which seems to 
            describe how you generally feel.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(stai_trait_instructions);

      // ===== STAI TRAIT Items =====
      var stai_trait_items = [
        "I feel pleasant",
        "I feel nervous and restless",
        "I feel satisfied with myself",
        "I wish I could be as happy as others seem to be",
        "I feel like a failure",
        "I feel rested",
        'I am "calm, cool, and collected"',
        "I feel that difficulties are piling up so that I cannot overcome them",
        "I worry too much over something that really doesn't matter",
        "I am happy",
        "I have disturbing thoughts",
        "I lack self-confidence",
        "I feel secure",
        "I make decisions easily",
        "I feel inadequate",
        "I am content",
        "Some unimportant thought runs through my mind and bothers me",
        "I take disappointments so keenly that I can't put them out of my mind",
        "I am a steady person",
        "I get in a state of tension or turmoil as I think over my recent concerns and interests",
      ];

      var stai_trait_scale = [
        "Almost never",
        "Sometimes",
        "Often",
        "Almost always",
      ];

      var stai_trait_responses = {};
      var stai_trait_reverse = [21, 23, 26, 27, 30, 33, 34, 36, 39];

      for (var i = 0; i < stai_trait_items.length; i += 4) {
        var page_items = stai_trait_items.slice(i, i + 4);
        var page_questions = page_items.map(function (item, idx) {
          var item_num = i + idx + 21;
          return {
            prompt: item_num + ". " + item,
            name: "stai_trait_" + item_num,
            labels: stai_trait_scale,
            required: true,
          };
        });

        var stai_trait_page = {
          type: jsPsychSurveyLikert,
          questions: page_questions,
          data: {
            task: "stai_trait",
            measure: "trait_anxiety",
          },
          on_finish: function (data) {
            var responses = data.response;
            for (var key in responses) {
              data[key] = responses[key];
              stai_trait_responses[key] = responses[key];
            }

            if (Object.keys(stai_trait_responses).length === 20) {
              var total = 0;
              for (var key in stai_trait_responses) {
                var item_num = parseInt(key.split("_")[2]);
                var score = stai_trait_responses[key];

                if (stai_trait_reverse.indexOf(item_num) !== -1) {
                  score = 3 - score;
                }
                total += score;
              }
              data.stai_trait_total = total + 20;
              jsPsych.data.addProperties({ stai_trait_total: total + 20 });
            }
          },
        };
        timeline.push(stai_trait_page);
      }

      // ===== BDI (Beck Depression Inventory) - Instructions =====
      var bdi_instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>This questionnaire consists of 21 groups of statements. Please read each group of statements carefully 
            and then pick out the one statement in each group that best describes the way you have been feeling during 
            the <strong>past week, including today</strong>.</p>
            <br>
            <p>Press any key to continue.</p>
          </div>
        `,
      };
      timeline.push(bdi_instructions);

      // ===== BDI Items =====
      var bdi_questions_all = [
        {
          prompt: "1.",
          name: "bdi_1",
          options: [
            "I do not feel sad",
            "I feel sad",
            "I am sad all the time and I can't snap out of it",
            "I am so sad and unhappy that I can't stand it",
          ],
          required: true,
        },
        {
          prompt: "2.",
          name: "bdi_2",
          options: [
            "I am not particularly discouraged about the future",
            "I feel discouraged about the future",
            "I feel I have nothing to look forward to",
            "I feel the future is hopeless and that things cannot improve",
          ],
          required: true,
        },
        {
          prompt: "3.",
          name: "bdi_3",
          options: [
            "I do not feel like a failure",
            "I feel I have failed more than the average person",
            "As I look back on my life, all I can see is a lot of failures",
            "I feel I am a complete failure as a person",
          ],
          required: true,
        },
        {
          prompt: "4.",
          name: "bdi_4",
          options: [
            "I get as much satisfaction out of things as I used to",
            "I don't enjoy things the way I used to",
            "I don't get real satisfaction out of anything anymore",
            "I am dissatisfied or bored with everything",
          ],
          required: true,
        },
        {
          prompt: "5.",
          name: "bdi_5",
          options: [
            "I don't feel particularly guilty",
            "I feel guilty a good part of the time",
            "I feel quite guilty most of the time",
            "I feel guilty all of the time",
          ],
          required: true,
        },
        {
          prompt: "6.",
          name: "bdi_6",
          options: [
            "I don't feel I am being punished",
            "I feel I may be punished",
            "I expect to be punished",
            "I feel I am being punished",
          ],
          required: true,
        },
        {
          prompt: "7.",
          name: "bdi_7",
          options: [
            "I don't feel disappointed in myself",
            "I am disappointed in myself",
            "I am disgusted with myself",
            "I hate myself",
          ],
          required: true,
        },
        {
          prompt: "8.",
          name: "bdi_8",
          options: [
            "I don't feel I am any worse than anybody else",
            "I am critical of myself for my weaknesses or mistakes",
            "I blame myself all the time for my faults",
            "I blame myself for everything bad that happens",
          ],
          required: true,
        },
        {
          prompt: "9.",
          name: "bdi_9",
          options: [
            "I don't have any thoughts of killing myself",
            "I have thoughts of killing myself, but I would not carry them out",
            "I would like to kill myself",
            "I would kill myself if I had the chance",
          ],
          required: true,
        },
        {
          prompt: "10.",
          name: "bdi_10",
          options: [
            "I don't cry any more than usual",
            "I cry more now than I used to",
            "I cry all the time now",
            "I used to be able to cry, but now I can't cry even though I want to",
          ],
          required: true,
        },
        {
          prompt: "11.",
          name: "bdi_11",
          options: [
            "I am no more irritated by things than I ever was",
            "I am slightly more irritated now than usual",
            "I am quite annoyed or irritated a good deal of the time",
            "I feel irritated all the time",
          ],
          required: true,
        },
        {
          prompt: "12.",
          name: "bdi_12",
          options: [
            "I have not lost interest in other people",
            "I am less interested in other people than I used to be",
            "I have lost most of my interest in other people",
            "I have lost all of my interest in other people",
          ],
          required: true,
        },
        {
          prompt: "13.",
          name: "bdi_13",
          options: [
            "I make decisions about as well as I ever could",
            "I put off making decisions more than I used to",
            "I have greater difficulty in making decisions more than I used to",
            "I can't make decisions at all anymore",
          ],
          required: true,
        },
        {
          prompt: "14.",
          name: "bdi_14",
          options: [
            "I don't feel that I look any worse than I used to",
            "I am worried that I am looking old or unattractive",
            "I feel there are permanent changes in my appearance that make me look unattractive",
            "I believe that I look ugly",
          ],
          required: true,
        },
        {
          prompt: "15.",
          name: "bdi_15",
          options: [
            "I can work about as well as before",
            "It takes an extra effort to get started at doing something",
            "I have to push myself very hard to do anything",
            "I can't do any work at all",
          ],
          required: true,
        },
        {
          prompt: "16.",
          name: "bdi_16",
          options: [
            "I can sleep as well as usual",
            "I don't sleep as well as I used to",
            "I wake up 1-2 hours earlier than usual and find it hard to get back to sleep",
            "I wake up several hours earlier than I used to and cannot get back to sleep",
          ],
          required: true,
        },
        {
          prompt: "17.",
          name: "bdi_17",
          options: [
            "I don't get more tired than usual",
            "I get tired more easily than I used to",
            "I get tired from doing almost anything",
            "I am too tired to do anything",
          ],
          required: true,
        },
        {
          prompt: "18.",
          name: "bdi_18",
          options: [
            "My appetite is no worse than usual",
            "My appetite is not as good as it used to be",
            "My appetite is much worse now",
            "I have no appetite at all anymore",
          ],
          required: true,
        },
        {
          prompt: "19.",
          name: "bdi_19",
          options: [
            "I haven't lost much weight, if any, lately",
            "I have lost more than five pounds",
            "I have lost more than ten pounds",
            "I have lost more than fifteen pounds",
          ],
          required: true,
        },
        {
          prompt: "20.",
          name: "bdi_20",
          options: [
            "I am no more worried about my health than usual",
            "I am worried about physical problems like aches, pains, upset stomach, or constipation",
            "I am very worried about physical problems and it's hard to think of much else",
            "I am so worried about my physical problems that I cannot think of anything else",
          ],
          required: true,
        },
        {
          prompt: "21.",
          name: "bdi_21",
          options: [
            "I have not noticed any recent change in my interest in sex",
            "I am less interested in sex than I used to be",
            "I have almost no interest in sex",
            "I have lost interest in sex completely",
          ],
          required: true,
        },
      ];

      var bdi_responses = {};

      // Create a mapping function to get the score from option text
      function getBDIScore(question_name, option_text) {
        // Find the question in bdi_questions_all
        for (var i = 0; i < bdi_questions_all.length; i++) {
          if (bdi_questions_all[i].name === question_name) {
            // Find the index of the selected option
            var score = bdi_questions_all[i].options.indexOf(option_text);
            return score >= 0 ? score : 0;
          }
        }
        return 0;
      }

      for (var i = 0; i < bdi_questions_all.length; i += 3) {
        var page_questions = bdi_questions_all.slice(i, i + 3);

        var bdi_page = {
          type: jsPsychSurveyMultiChoice,
          questions: page_questions,
          data: {
            task: "bdi",
            measure: "depression",
          },
          on_finish: function (data) {
            // jsPsych multi-choice returns the OPTION TEXT, not the index
            var responses = data.response;
            for (var key in responses) {
              var option_text = responses[key];
              // Convert option text to numeric score (0-3)
              var score = getBDIScore(key, option_text);
              data[key] = score;
              bdi_responses[key] = score;
            }

            // Calculate total ONLY when all 21 items are collected
            if (Object.keys(bdi_responses).length === 21) {
              var total = 0;
              for (var key in bdi_responses) {
                total += bdi_responses[key];
              }

              // Store numeric total
              data.bdi_total = total;

              // Determine severity level
              var level;
              if (total <= 10) {
                level = "normal";
              } else if (total <= 16) {
                level = "mild_mood_disturbance";
              } else if (total <= 20) {
                level = "borderline_clinical";
              } else if (total <= 30) {
                level = "moderate_depression";
              } else if (total <= 40) {
                level = "severe_depression";
              } else {
                level = "extreme_depression";
              }

              data.bdi_level = level;

              // Add to global properties so it appears in all rows
              jsPsych.data.addProperties({
                bdi_total: total,
                bdi_level: level,
              });
            }
          },
        };
        timeline.push(bdi_page);
      }

      // Instructions for WSAP task
      var instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>In this task, you will see a word followed by a sentence.</p>
            <p>Your job is to decide whether the word and sentence are related.</p>
            <br>
            <p><strong>Here's what will happen on each trial:</strong></p>
            <ol style="text-align: left; display: inline-block; margin: 0 auto;">
              <li>A fixation cross (+) will appear briefly</li>
              <li>A word will appear briefly</li>
              <li>A sentence will appear - press the SPACEBAR when you finish reading it</li>
              <li>You'll be asked if the word and sentence are related</li>
            </ol>
            <br><br>
            <p><strong>To respond:</strong></p>
            <p>Press <strong>1</strong> on the number pad if they ARE related</p>
            <p>Press <strong>3</strong> on the number pad if they ARE NOT related</p>
            <br>
            <p>Press any key to begin.</p>
          </div>
        `,
        post_trial_gap: 500,
      };
      timeline.push(instructions);

      // WSAP trials - CHANGE THIS to shuffle(set_stimuli) for full experiment
      var randomized_stimuli = jsPsych.randomization.shuffle(set_stimuli);

      var fixation = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="font-size: 60px; color: black;">+</div>',
        choices: "NO_KEYS",
        trial_duration: 500,
        post_trial_gap: 0,
      };

      var prime = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          var word = jsPsych.evaluateTimelineVariable("Word");
          return (
            '<div style="font-size: 16px; color: black;">' + word + "</div>"
          );
        },
        choices: "NO_KEYS",
        trial_duration: 500,
        post_trial_gap: 0,
      };

      var sentence = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          var sent = jsPsych.evaluateTimelineVariable("Sentence");
          return (
            '<div style="font-size: 16px; color: black; max-width: 800px; margin: 0 auto;">' +
            sent +
            "</div>" +
            '<div style="font-size: 11pt; color: #666; margin-top: 30px;">' +
            "Press the <strong>SPACEBAR</strong> when you have finished reading." +
            "</div>"
          );
        },
        choices: [" "],
        post_trial_gap: 0,
        data: {
          trial_part: "sentence_reading",
        },
        on_finish: function (data) {
          data.sentence_reading_time = data.rt;
        },
      };

      var judgment = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="font-size: 16px; color: black;">
            <p>Were the word and sentence related?</p>
            <br>
            <p>Press <strong>1</strong> for YES (related)</p>
            <p>Press <strong>3</strong> for NO (not related)</p>
          </div>
        `,
        choices: ["1", "3"],
        data: {
          task: "wsap",
          trial_part: "judgment",
          assigned_set: assigned_set,
          word: jsPsych.timelineVariable("Word"),
          sentence: jsPsych.timelineVariable("Sentence"),
          trial_type: jsPsych.timelineVariable("Trial type"),
          domain: jsPsych.timelineVariable("Domain"),
        },
        on_finish: function (data) {
          // Store response
          data.response_key = data.response;
          data.related_judgment =
            data.response === "1" ? "related" : "not_related";
          data.judgment_rt = data.rt;

          // Get trial type from timeline variable (it's already in data from above)
          var trial_type = data.trial_type;

          // Determine if they endorsed the target interpretation
          if (trial_type === "Negative" || trial_type === "Positive") {
            // For interpretable trials, "related" response = endorsed the interpretation
            data.endorsed_interpretation = data.response === "1";
          } else {
            // For foil trials, no interpretation to endorse
            data.endorsed_interpretation = null;
          }
        },
      };

      var trial_procedure = {
        timeline: [fixation, prime, sentence, judgment],
        timeline_variables: randomized_stimuli,
      };
      timeline.push(trial_procedure);

      // Debrief
      var debrief = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
          <div style="color: black; font-size: 16px; max-width: 700px; margin: 0 auto; 
            text-align: center; background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
            <p>Thank you for participating!</p>
            <p>The aim of this experiment is to examine the influence of positive and 
              negative beliefs on interpretation of ambiguous information in individuals 
              with varying levels of anxiety.</p>
            <br>
            <p>This study is a replication of the paper "Interpretation in Social Anxiety:
               When Meaning Precedes Ambiguity" by Beard et al. (2010). You can learn more 
               about the study <a href="https://link.springer.com/article/10.1007/s10608-009-9235-0">here</a>.
               This study is conducted for a class final project and the data collected will be used for academic purposes only.</p>
            <p><strong>To submit your response, please press any key.</strong></p>
          </div>
        `,
        on_finish: function (data) {
          var experiment_end_time = Date.now();
          var total_time_ms = experiment_end_time - experiment_start_time;
          var total_time_seconds = Math.round(total_time_ms / 1000);
          var total_time_minutes = (total_time_ms / 60000).toFixed(2);

          data.total_time_ms = total_time_ms;
          data.total_time_seconds = total_time_seconds;
          data.total_time_minutes = total_time_minutes;

          jsPsych.data.addProperties({
            total_time_ms: total_time_ms,
            total_time_seconds: total_time_seconds,
            total_time_minutes: total_time_minutes,
          });
        },
      };
      timeline.push(debrief);

      jsPsych.run(timeline);

      const observer = new MutationObserver(() => {
        document
          .querySelectorAll(".jspsych-survey-likert-question")
          .forEach((el) => {
            el.style.width = "900px";
            el.style.maxWidth = "900px";
            el.style.minWidth = "900px";
            el.style.margin = "0 auto 30px auto";
          });
      });

      observer.observe(document.body, { childList: true, subtree: true });
    }
  </script>
